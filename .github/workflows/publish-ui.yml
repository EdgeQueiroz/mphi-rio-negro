name: MPHI - Publicar interface consolidada

on:
  push:
    branches: ["fileOrganizer"]
    paths:
      - "docs/index.html"
      - "docs/app.js"
      - "docs/styles.css"
      - "tests/test_public_view.cjs"
      - ".github/workflows/publish-ui.yml"
  pull_request:
    paths:
      - "docs/index.html"
      - "docs/app.js"
      - "docs/styles.css"
      - "tests/test_public_view.cjs"
      - ".github/workflows/publish-ui.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "mphi-ui-pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  verify-theme:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript e organização da interface
        run: |
          node --check docs/app.js
          node --test tests/test_public_view.cjs

  publish:
    needs: verify-theme
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/fileOrganizer'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Buscar a versao atual do repositorio
        uses: actions/checkout@v4
        with:
          ref: fileOrganizer
      - name: Validar HTML antes de publicar
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('docs/index.html').read_text(encoding='utf-8')
          assert 'id="tabatinga"' not in html, 'Cartao de Tabatinga ainda no HTML'
          assert 'tabatinga.js' not in html, 'Script visual de Tabatinga ainda no HTML'
          assert 'tabatinga.css' not in html, 'Estilo visual de Tabatinga ainda no HTML'
          assert 'id="projecoes"' in html, 'Projecoes do MPHI ausentes'
          assert 'id="meteorologia"' in html, 'Bloco meteorologico ausente'
          assert 'MPHI-PUBLIC-VIEW-V2' in html, 'Novo painel de previsao nao encontrado'
          assert 'shadowProjectionBlock' not in html, 'Projecao paralela exposta no publico'
          assert 'MPHI-LIGHT-BLUE-V3' in html, 'Novo tema nao encontrado'
          assert html.index('class="update-strip"') < html.index('class="historic-records"') < html.index('class="facts-strip"') < html.index('id="projecoes"'), 'Marcas historicas fora da posicao solicitada'
          css = Path('docs/styles.css').read_text(encoding='utf-8')
          assert 'MPHI WATER-BLUE V3' in css and 'color-scheme:light' in css, 'Paleta azul-clara nao encontrada'
          print('Interface aprovada, sem quadro de Tabatinga.')
          PY
      - name: Verificar sintaxe e integridade da previsão pública
        run: |
          node --check docs/app.js
          node --test tests/test_public_view.cjs
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefato estatico
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Publicar pagina no GitHub Pages
        id: deployment
        uses: ./.github/actions/deploy-pages-with-retry
      - name: Verificar HTML publico apos publicacao
        run: |
          python - <<'PY'
          import time
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen
          url = 'https://edgequeiroz.github.io/mphi-rio-negro/?mphi_check='
          for attempt in range(1, 13):
              try:
                  req = Request(url + str(time.time_ns()), headers={'Cache-Control': 'no-cache'})
                  with urlopen(req, timeout=15) as response:
                      page = response.read().decode('utf-8')
                  css_req = Request('https://edgequeiroz.github.io/mphi-rio-negro/styles.css?v=20261118-azul-aguas&verify=' + str(time.time_ns()), headers={'Cache-Control': 'no-cache'})
                  with urlopen(css_req, timeout=15) as stylesheet:
                      css = stylesheet.read().decode('utf-8')
                  has_positions = page.index('class="update-strip"') < page.index('class="historic-records"') < page.index('class="facts-strip"') < page.index('id="projecoes"')
                  if 'id="tabatinga"' not in page and 'tabatinga.js' not in page and 'id="projecoes"' in page and 'MPHI-PUBLIC-VIEW-V2' in page and 'shadowProjectionBlock' not in page and 'MPHI-LIGHT-BLUE-V3' in page and 'MPHI WATER-BLUE V3' in css and has_positions:
                      print('CONFIRMADO: tema azul-claro, marcas historicas abaixo da medicao e previsao unica preservada.')
                      break
                  print(f'Tentativa {attempt}: HTML publico ainda antigo ou incompleto.')
              except Exception as exc:
                  print(f'Tentativa {attempt}: {type(exc).__name__} ao consultar o site.')
              if attempt == 12:
                  raise SystemExit('Falha: nao foi possivel confirmar HTML publico atualizado.')
              time.sleep(5)
          Path('docs/data/ui_deploy_verification.json').write_text(json.dumps({
              'schema': 'mphi-ui-deploy-verification-v1',
              'verified_at_utc': datetime.now(timezone.utc).isoformat(timespec='seconds'),
              'verified_url': 'https://edgequeiroz.github.io/mphi-rio-negro/',
              'tabatinga_panel_absent': True,
              'consolidated_marker_present': True,
              'projection_panel_present': True,
              'single_public_rios_negro_forecast': True,
              'experimental_forecast_panels_absent': True,
              'water_blue_theme_verified': True,
              'historical_marks_below_current_verified': True,
              'note': 'Verification made by workflow against public HTML after Pages deployment.'
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Registrar no repositorio a verificacao efetiva
        run: |
          git config user.name 'mphi-ui-deploy-bot'
          git config user.email 'mphi-ui-deploy-bot@users.noreply.github.com'
          git add docs/data/ui_deploy_verification.json
          git commit -m 'chore(mphi): record verified UI deployment'
          git pull --rebase origin fileOrganizer
          git push origin HEAD:fileOrganizer
