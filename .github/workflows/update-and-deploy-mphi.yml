name: Atualizar e publicar MPHI

on:
  push:
    branches: ["fileOrganizer"]
    paths-ignore:
      - "docs/data/latest.json"
      - "docs/data/forecast_ledger.json"
      - "docs/data/validation.json"
  schedule:
    - cron: '50 11 * * *'
    - cron: '20 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Atualizar dados e validar previsões MPHI
        id: update
        run: python scripts/update_mphi.py
        continue-on-error: true
      - name: Registrar atualização no repositório
        run: |
          git config user.name "MPHI Bot"
          git config user.email "mphi-bot@users.noreply.github.com"
          git add docs/data/latest.json docs/data/forecast_ledger.json docs/data/validation.json
          git diff --cached --quiet || git commit -m "Atualiza MPHI e validacao $(date -u +%F)"
          git push
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
