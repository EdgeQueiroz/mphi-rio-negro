name: Atualizar e publicar MPHI

on:
  push:
    branches: ["fileOrganizer"]
    paths-ignore:
      - "docs/data/latest.json"
      - "docs/data/forecast_ledger.json"
      - "docs/data/validation.json"
  schedule:
    - cron: '50 11 * * 1-5'
    - cron: '20 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Atualizar dados e validar previsões MPHI
        id: update
        run: |
          python - <<'PY'
          import sys
          from datetime import datetime, timedelta

          sys.path.insert(0, 'scripts')
          import update_mphi

          def persistence_days_operational(valid, d):
              count = 0
              later_date = None
              for i in range(len(valid) - 1, -1, -1):
                  current_date = datetime.fromisoformat(valid[i]['date']).date()

                  if later_date is not None:
                      gap = (later_date - current_date).days
                      if gap < 1:
                          break
                      if gap > 1:
                          probe = current_date + timedelta(days=1)
                          while probe < later_date:
                              if probe.weekday() < 5:
                                  return count
                              probe += timedelta(days=1)

                  if update_mphi.base_score_for_prefix(valid, i, d) < 3:
                      break

                  count += 1
                  later_date = current_date

              return count

          update_mphi.persistence_days = persistence_days_operational
          update_mphi.main()
          PY
        continue-on-error: true
      - name: Registrar atualização no repositório
        run: |
          git config user.name "MPHI Bot"
          git config user.email "mphi-bot@users.noreply.github.com"
          git add docs/data/latest.json docs/data/forecast_ledger.json docs/data/validation.json
          git diff --cached --quiet || git commit -m "Atualiza MPHI e validacao $(date -u +%F)"
          git push
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
