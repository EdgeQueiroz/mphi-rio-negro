name: Atualizar e publicar MPHI

on:
  push:
    branches: ["fileOrganizer"]
    paths-ignore:
      - "docs/data/latest.json"
      - "docs/data/forecast_ledger.json"
      - "docs/data/validation.json"
  schedule:
    - cron: '17,43 12-21 * * *' # 08:17–17:43 America/Manaus; evita o topo da hora e cobre a publicação tardia do Porto
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "mphi-sync-${{ github.ref }}"
  # Mantém apenas a tentativa mais recente; não deixa a fila de Pages coalescer as coletas agendadas.
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Sincronizar Porto e recalcular MPHI
        id: update
        run: python scripts/sync_mphi.py

      - name: Detectar alteração válida
        id: changes
        run: |
          if git diff --quiet -- docs/data/latest.json docs/data/forecast_ledger.json docs/data/validation.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum dado novo ou lacuna recuperada."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Nova medição, correção ou lacuna recuperada."
          fi

      - name: Registrar atualização no repositório
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "MPHI Bot"
          git config user.email "mphi-bot@users.noreply.github.com"
          git add docs/data/latest.json docs/data/forecast_ledger.json docs/data/validation.json
          git commit -m "Atualiza MPHI e validacao $(date -u +%F)"
          git push

      - name: Configurar GitHub Pages
        if: github.event_name != 'schedule' || steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Preparar site
        if: github.event_name != 'schedule' || steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Publicar GitHub Pages
        if: github.event_name != 'schedule' || steps.changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
